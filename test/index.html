<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Firebase Storage 画像アップロード＆表示テスト</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .preview-container img { width: 150px; height: 150px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>写真アップロード・表示アプリ</h1>

    <!-- 画像選択フォーム -->
    <input type="file" id="imageInput" accept="image/*">
    <button id="uploadButton">アップロード</button>
    <p id="status"></p>

    <h2>保存された写真一覧</h2>
    <div id="imageContainer" class="preview-container"></div>
</body>
</html>
